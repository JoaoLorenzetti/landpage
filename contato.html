<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entre em Contato</title>
    <link rel="stylesheet" href="contato.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Poppins:wght@700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h1>Entre em contato</h1>
        
        <form class="formulario_ctt">
            <div class="forma">
                <label for="nome">Nome</label>
                <input type="text" id="nome" name="nome" required>
            </div>
            <div class="forma">
                <label for="sobrenome">Sobrenome</label>
                <input type="text" id="sobrenome" name="sobrenome" required>
            </div>
            <div class="forma">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="forma">
                <label for="mensagem">Mensagem</label>
                <textarea id="mensagem" name="mensagem" rows="3" required></textarea> 
            </div>
            
            <button type="submit" class="enviar">ENVIAR</button>
        </form>
    </div>
</body>
</html>
