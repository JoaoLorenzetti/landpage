<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feature de Localização e Contatos</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Open+Sans:wght@400&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="devmapa.css">
</head>
<body>

<div class="localizacao-card">
    <h2 class="titulo-localizacao">Localização</h2>

    <address class="endereco-info">
        Rua - Fulana de tal, 9999<br>
        CEP 99999-999<br>
        Pindorama/SP
    </address>

    <div class="mapa-container">
        <img src="assets/imagens/mapa.png" alt="Mapa de Pindorama" class="mapa-imagem">
    </div>

    <div class="contatos-sociais">
        
        <div class="contato-item first-contato"> 
            <div class="contato-info-box">
                <img src="assets/imagens/whatsapp.png" alt="WhatsApp" class="icone-social">
                <span class="contato-texto texto-whatsapp">(99)-999999999</span>
            </div>
        </div>

        <div class="contato-item"> 
            <div class="contato-info-box">
                <img src="assets/imagens/instagram.png" alt="Instagram" class="icone-social">
                <span class="contato-texto texto-instagram">@PindoramaClinica</span>
            </div>
        </div>

        <div class="contato-item last-contato">
            <div class="contato-info-box">
                <img src="assets/imagens/facebook.png" alt="Facebook" class="icone-social">
                <span class="contato-texto texto-facebook">PindoramaClinica</span>
            </div>
        </div>
    </div>
</div>

</body>
</html>
