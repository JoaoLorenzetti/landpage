<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pindorama Pets Footer</title>
    <link rel="stylesheet" href="gabriel_desk.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

    <footer class="footer">
        <div class="conteudo">

            <div class="margem logo">
                <img src="assets/imagens/logotipo" alt="Pindorama Pets Logo" class="imagem">
            </div>

            <div class="margem">
                <h3 class="titulo_header">NOSSOS SERVIÇOS</h3>
                <div class="text-group">
                    <p class="txt_footer">SOBRE NÓS</p>
                    <p class="txt_footer">CONSULTA VETERINÁRIA</p>
                    <p class="txt_footer">NOSSOS SERVIÇOS</p>
                </div>
            </div>

            <div class="margem">
                <h3 class="titulo_header">INSTITUCIONAL</h3>
                <div class="text-group">
                    <p class="txt_footer">PROGRAMA DE ADOÇÃO</p>
                    <p class="txt_footer">TERMOS DE COMPROMISSO</p>
                    <p class="txt_footer">UNECT JR</p>
                </div>
            </div>

            <div class="margem margem_logoss">
                <h3 class="titulo_header">NOSSOS CONTATOS</h3>
                <div class="social-icons">
                    <img src="assets/imagens/whatsapp.jpg" alt="WhatsApp" class="imagem_logoss">
                    <img src="assets/imagens/instagram.jpg" alt="Instagram" class="imagem_logoss">
                    <img src="assets/imagens/facebook.jpg" alt="Facebook" class="imagem_logoss">
                </div>
            </div>

        </div>

        <div class="bottom_fotter">
            <p class="txt_final">UNECT JR - TODOS OS DIREITOS RESERVADOS</p>
        </div>
    </footer>

</body>
</html>
