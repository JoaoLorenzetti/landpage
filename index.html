<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pindorama Pets</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- CABEÇALHO (Header) -->
<header>
    
    <!-- Ícone de Menu Hamburguer (Esquerda) -->
    <button class="hamburger-menu">
       <img src="images/Menu.svg" alt="Menu">
    </button>

    <div class="logo">
        <img src="images/logo.svg" alt="Logo Pindorama Pets">
    </div>

</header>
     
        <!-- Seção Hero -->
     <section id="hero">
            <div class="hero-content">
                
                <!-- Texto -->
                <h1 class="hero-title">
                    Cuidamos do seu<br>animal com muito<br>amor
                </h1>

                <!-- Imagem dos animais -->
                <div class="hero-image">
                    <img src="images/animais_hero.svg" alt="Vários pets olhando para a câmera">
                </div>
                
                <!-- Botão de Ação -->
                <button class="cta-button">
                  <span class="title-button">Entre em contato</span>
                  </button>
            </div>
        </section>

       <!-- Seção Quem somos -->
     <section id="Somos">
          <div class="QuemSomos">
                <h2 class="Titulo">Quem somos?</h2>
             <div class="logo2">
                <img src="images/logo2.svg" alt="logo2">
             </div>
             <div class="texto1">
                <p>Nossa clínica veterinária é comprometida com o cuidado e bem-estar de cada pet, com uma equipe dedicada e instalações modernas, buscamos garantir saúde e conforto em cada atendimento.</p>
             </div>
             <div class="texto2">
                <p>Cuidamos do seu animalzinho com amor!</p>
             </div>
             </div>
     </section>
 
</body>
</html>
